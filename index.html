<title>Final Schedule Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Great+Vibes&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #5c1116; --bg-deep: #2c0709; --panel: #4a1015; --panel-border: #d9a53a55;
    --paper: #f3ead4; --paper-edge: #cbb98e; --ink: #2c1210; --ink-dim: #6b4a3d;
    --gold: #e0ac45; --gold-dim: #b3822e; --cream: #f6eedd; --text: #f6eedd; --text-dim: #d9c3a4;
    --red: #9c2b2e; --red-dim: #6e1c1f; --alert: #ff8a7a;
    --display: "Anton", "IBM Plex Sans", sans-serif; --sans: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace; --script: "Great Vibes", cursive;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.1) 0 26px, rgba(0,0,0,0) 26px 52px),
      radial-gradient(ellipse 120% 90% at 50% -10%, #7a1a1f 0%, var(--bg) 45%, var(--bg-deep) 100%);
    background-attachment: fixed; color: var(--text); font: 15px/1.5 var(--sans); min-height: 100dvh; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 22px 16px 80px; }

  /* brand */
  .top { display: flex; align-items: center; gap: 14px; padding: 4px 2px 20px; }
  .crest { width: 58px; height: 58px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); box-shadow: 0 0 0 3px var(--red-dim), 0 8px 18px -6px rgba(0,0,0,.6); flex-shrink: 0; }
  .brand { font-family: var(--display); font-weight: 400; font-size: 1.85rem; line-height: 1; letter-spacing: .05em; text-transform: uppercase; color: var(--gold); text-shadow: 0 0 24px rgba(224,172,69,.3); margin: 0; }
  .eyebrow { font-family: var(--mono); font-size: .64rem; letter-spacing: .18em; text-transform: uppercase; color: var(--text-dim); margin-top: 6px; }
  .tag { margin-left: auto; font-family: var(--script); color: var(--gold); font-size: 1.5rem; line-height: 1; text-align: right; }
  @media (max-width: 560px) { .tag { display: none; } .brand { font-size: 1.5rem; } }

  /* cabinet */
  .cabinet { background: linear-gradient(180deg, #5c1419, #380a0d); border: 1px solid var(--panel-border); border-radius: 22px; padding: 20px; box-shadow: 0 40px 80px -30px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.06); }
  .step { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
  .step i { font-style: normal; font-family: var(--display); width: 26px; height: 26px; border-radius: 50%; background: var(--gold); color: var(--ink); display: grid; place-items: center; font-size: .9rem; flex-shrink: 0; }
  .step span { font-family: var(--mono); font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: var(--text-dim); }
  .step + * { margin-bottom: 22px; }

  select, input[type=search] { width: 100%; min-height: 48px; padding: 0 14px; font: 1rem var(--sans); color: var(--ink); background: var(--paper); border: 2px solid transparent; border-radius: 10px; outline: none; }
  select { appearance: none; padding-right: 36px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%), linear-gradient(135deg, var(--ink-dim) 50%, transparent 50%);
    background-position: calc(100% - 19px) 21px, calc(100% - 14px) 21px; background-size: 5px 5px; background-repeat: no-repeat; }
  select:focus, input:focus { border-color: var(--gold); }
  input::placeholder { color: #9a8563; }
  input[type=search]::-webkit-search-cancel-button { display: none; }

  .search { position: relative; }
  .results { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 6px); background: var(--paper); border: 1px solid var(--paper-edge); border-radius: 12px; box-shadow: 0 24px 40px -12px rgba(0,0,0,.7); max-height: 330px; overflow: auto; display: none; padding: 4px; }
  .results.open { display: block; }
  .results button { display: flex; width: 100%; text-align: left; gap: 12px; align-items: baseline; border: 0; border-radius: 8px; background: none; padding: 10px 12px; font: inherit; cursor: pointer; color: var(--ink); }
  .results button b { font-family: var(--mono); font-weight: 600; font-size: .9rem; flex-shrink: 0; color: var(--red-dim); }
  .results button:hover, .results button.active { background: #e8d9b3; }
  .results .dept { color: var(--ink-dim); font-size: .9rem; }
  .results .none { padding: 14px; color: var(--ink-dim); }

  .chips { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .chips:empty { display: none; }
  .chip { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; background: rgba(0,0,0,.2); border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 10px 10px 16px; }
  .chip .nm { font-family: var(--mono); font-weight: 600; color: var(--gold); letter-spacing: .04em; }
  .chip .nm small { display: block; font-family: var(--sans); font-weight: 400; letter-spacing: 0; color: var(--text-dim); font-size: .88rem; }
  .chip .secwrap { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim); }
  .chip select { width: auto; min-height: 40px; max-width: 220px; font-size: .92rem; }
  .chip .x { border: 0; background: rgba(255,255,255,.08); color: var(--cream); border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-size: 18px; line-height: 1; }
  .chip .x:hover { background: var(--red); }
  .chip.need { border-color: var(--alert); background: rgba(156,43,46,.35); }
  .chip.need select { border-color: var(--alert); }
  @media (max-width: 560px) { .chip { grid-template-columns: 1fr auto; } .chip .secwrap { grid-column: 1 / -1; grid-row: 2; } .chip .secwrap select { flex: 1; max-width: none; } }
  .status { font-family: var(--mono); font-size: .68rem; letter-spacing: .06em; color: var(--text-dim); margin: 14px 0 0; }
  .status:empty { display: none; }
  .status.err { color: var(--alert); }

  /* buttons */
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn { appearance: none; border: 0; cursor: pointer; font-family: var(--display); letter-spacing: .08em; text-transform: uppercase; font-size: 1rem; min-height: 50px; padding: 0 22px; border-radius: 12px; display: inline-flex; align-items: center; gap: 8px; transition: transform .12s, filter .12s, opacity .12s; }
  .btn:active { transform: translateY(1px) scale(.99); }
  .btn:hover:not(:disabled) { filter: brightness(1.07); }

  .term { font-weight: 600; color: var(--ink); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 20px 0 6px; }

  .stats b { display: block; font-family: var(--display); font-weight: 400; font-size: 1.45rem; line-height: 1.1; color: var(--red-dim); letter-spacing: .03em; }

  .clashnote { color: #b3261e; font-size: .74rem; font-weight: 700; grid-column: 1 / -1; font-family: var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .pending { color: #b3261e; font-weight: 600; margin: 10px 0 0; font-size: .92rem; }
  .empty { text-align: center; padding: 44px 10px 38px; color: var(--ink-dim); }

  }

const $ = id => document.getElementById(id);
const MONTHS = ["january","february","march","april","may","june","july","august","september","october","november","december"];
let exams = [];            // {course, code, section, date:'YYYY-MM-DD', start, end, room}
let byCourse = new Map();  // course label -> exams[]
let picks = [];            // {course, section}  section: '' = all/unspecified
let termIdx = 0;

/* ---------- CSV + sheet parsing ---------- */
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (c !== "\r") cell += c;
  }
  row.push(cell); rows.push(row);
  return rows;
}
const TIME_RE = /(\d{1,2}):(\d{2})\s*[–—-]\s*(\d{1,2}):(\d{2})/;
const COURSE_RE = /^([A-Z]{2,5})\s?(\d{3})\s*(\(.*\))?$/;
const pad = n => String(n).padStart(2, "0");

function parseDate(s) {
  const m = /(\d{1,2})\s+([A-Za-z]+),?\s+(\d{4})/.exec(s);
  if (!m) return null;
  const mo = MONTHS.indexOf(m[2].toLowerCase());
  return mo < 0 ? null : `${m[3]}-${pad(mo + 1)}-${pad(+m[1])}`;
}

function parseSheet(rows) {
  const out = [];
  const dateRow = rows.findIndex(r => r[0] && r[0].trim() === "Date");
  if (dateRow < 0) return out;
  // each day is a block starting at a "Date" cell; its value sits in the next cell
  const blocks = [];
  rows[dateRow].forEach((c, i) => { if (c.trim() === "Date") { const d = parseDate(rows[dateRow][i + 1] || ""); if (d) blocks.push({ col: i, date: d }); } });
  blocks.forEach((b, bi) => { b.end = bi + 1 < blocks.length ? blocks[bi + 1].col : rows[dateRow].length; });
  for (const b of blocks) {
    let time = null, cols = null;
    for (let r = dateRow + 1; r < rows.length; r++) {
      const cells = rows[r].slice(b.col, b.end).map(x => (x || "").trim());
      if (cells[0] === "Time") {   // header row of a slot: learn which column is which
        cols = {}; cells.forEach((h, i) => { cols[h.toLowerCase()] = i; });
        time = null; continue;
      }
      const tm = TIME_RE.exec(cells[0] || "");
      if (tm) time = { start: `${pad(+tm[1])}:${tm[2]}`, end: `${pad(+tm[3])}:${tm[4]}` };
      if (!time || !cols) continue;
      const label = (cells[cols.course] || "").replace(/\s+/g, " ");
      const cm = COURSE_RE.exec(label);
      if (!cm) continue;
      const secCol = cols.section, roomCol = cols.room ?? cols["class room"];
      out.push({
        course: label, code: `${cm[1]} ${cm[2]}`,
        section: secCol != null ? cells[secCol] : "",
        date: b.date, start: time.start, end: time.end,
        room: roomCol != null ? cells[roomCol] : "",
      });
    }
  }
  return out;
}

/* ---------- loading ---------- */
async function loadTerm(idx) {
  const [name, gid] = SHEETS[idx];
  const key = "fsm-cache-" + gid;
  $("status").className = "status";
  $("status").textContent = "Loading exam data…";
  let data = null, stale = false;
  try {
    const res = await fetch(`${PUB}?gid=${gid}&single=true&output=csv`);
    if (!res.ok) throw new Error(res.status);
    data = parseSheet(parseCSV(await res.text()));
    try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {}
  } catch (e) {
    try { data = JSON.parse(localStorage.getItem(key)); stale = !!data; } catch (e2) {}
    if (!data && SNAPSHOT[gid]) {
      data = SNAPSHOT[gid].map(([course, code, section, date, start, end, room]) => ({ course, code, section, date, start, end, room }));
      stale = true;
    }
  }
  if (!data) {
    exams = []; index();
    $("status").className = "status err";
    $("status").textContent = "Couldn't load the exam sheet. Check your connection and reload.";
    render(); return;
  }
  exams = data; index();
  const n = byCourse.size;
  $("status").textContent = n ? "" :
    `No exam schedule is published for ${name} yet.`;
  picks = picks.filter(p => byCourse.has(p.course));
  render();
}
function index() {
  byCourse = new Map();
  for (const e of exams) { if (!byCourse.has(e.course)) byCourse.set(e.course, []); byCourse.get(e.course).push(e); }
}

/* ---------- search ---------- */
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, "");
let active = -1, shown = [];
function search(q) {
  const n = norm(q), words = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!n) return [];
  const list = [...byCourse.keys()].filter(c => {
    const hay = ((DEPTS[c.slice(0, c.indexOf(" "))] || "") + " " + titleOf(c) + " " + c).toLowerCase();
    return norm(c).includes(n) || words.every(w => hay.includes(w));
  });
  list.sort((a, b) => (norm(a).startsWith(n) ? 0 : 1) - (norm(b).startsWith(n) ? 0 : 1) || a.localeCompare(b));
  return list.slice(0, 40);
}
function showResults() {
  const box = $("results");
  const q = $("q").value;
  if (!q.trim()) { box.classList.remove("open"); return; }
  shown = search(q); active = shown.length ? 0 : -1;
  box.innerHTML = shown.length ? shown.map((c, i) =>
      `<button type="button" data-i="${i}" class="${i === active ? "active" : ""}"><b>${c}</b><span class="dept">${esc(titleOf(c) || DEPTS[c.slice(0, c.indexOf(" "))] || "")}</span></button>`).join("")
    : `<div class="none">No matching course in this term's schedule.</div>`;
  box.classList.add("open");
}
function addCourse(c) {
  if (c && !picks.some(p => p.course === c)) {
    picks.push({ course: c, section: autoSection(c) });
    save(); render();
  }
  $("q").value = ""; $("results").classList.remove("open"); $("q").focus();
}
$("q").addEventListener("input", showResults);
$("q").addEventListener("focus", showResults);
$("q").addEventListener("keydown", e => {
  const btns = [...$("results").querySelectorAll("button")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); if (!btns.length) return;
    active = (active + (e.key === "ArrowDown" ? 1 : -1) + btns.length) % btns.length;
    btns.forEach((b, i) => b.classList.toggle("active", i === active));
    btns[active].scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") { e.preventDefault(); if (shown[active]) addCourse(shown[active]); }
  else if (e.key === "Escape") $("results").classList.remove("open");
});
$("results").addEventListener("mousedown", e => { const b = e.target.closest("button"); if (b) { e.preventDefault(); addCourse(shown[+b.dataset.i]); } });
document.addEventListener("click", e => { if (!e.target.closest(".search")) $("results").classList.remove("open"); });

/* ---------- selection ---------- */
// If every section sits in the same slot we don't need to ask which section the student is in.
function slotKey(e) { return e.date + e.start + e.end; }
function sectionsOf(c) { return byCourse.get(c) || []; }
function sameSlot(c) { const s = sectionsOf(c); return s.every(e => slotKey(e) === slotKey(s[0])); }
function autoSection(c) { const s = sectionsOf(c); return s.length === 1 ? s[0].section : ""; }

function resolved() {
  const out = [], pending = [];
  for (const p of picks) {
    const all = sectionsOf(p.course);
    if (!all.length) continue;
    if (p.section) { out.push(...all.filter(e => e.section === p.section)); }
    else if (sameSlot(p.course)) {
      const rooms = [...new Set(all.map(e => e.room))];
      out.push({ ...all[0], section: "", room: rooms.length === 1 ? rooms[0] : "Room depends on section" });
    } else pending.push(p.course);
  }
  out.sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start) || a.course.localeCompare(b.course));
  return { out, pending };
}
const toMin = t => +t.slice(0, 2) * 60 + +t.slice(3);
function markClashes(list) {
  list.forEach(e => e.clash = false);
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
    const a = list[i], b = list[j];
    if (a.date === b.date && toMin(a.start) < toMin(b.end) && toMin(b.start) < toMin(a.end)) a.clash = b.clash = true;
  }
}
function save() { try { localStorage.setItem("fsm-state", JSON.stringify({ term: SHEETS[termIdx][1], picks })); } catch (e) {} }

/* ---------- rendering ---------- */
const fmtDate = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render() {
  // chips
  $("chips").innerHTML = picks.map((p, i) => {
    const secs = sectionsOf(p.course);
    let sel = "";
    if (secs.length > 1) {
      const same = sameSlot(p.course);
      sel = `<label class="secwrap">Section <select data-i="${i}" aria-label="Section for ${esc(p.course)}">` +
        `<option value="">${same ? "Any / not sure" : "Choose…"}</option>` +
        secs.map(e => `<option value="${esc(e.section)}"${e.section === p.section ? " selected" : ""}>${esc(e.section)}${same ? "" : " · " + e.date.slice(5) + " " + e.start}${e.room ? " · " + esc(e.room) : ""}</option>`).join("") + `</select></label>`;
    } else if (secs[0] && secs[0].section) sel = `<span class="secwrap">Section ${esc(secs[0].section)}</span>`;
    const need = !p.section && secs.length > 1 && !sameSlot(p.course);
    const t = titleOf(p.course);
    return `<div class="chip${need ? " need" : ""}"><div class="nm">${esc(p.course)}${t ? `<small>${esc(t)}</small>` : ""}</div>${sel || "<span></span>"}<button class="x" data-i="${i}" aria-label="Remove ${esc(p.course)}">×</button></div>`;
  }).join("");

  const { out, pending } = resolved();
  markClashes(out);
  const termName = SHEETS[termIdx][0].replace(/^\((UG|Graduate)\)\s*/, (m, l) => "") ;
  const level = /Graduate/.test(SHEETS[termIdx][0]) ? "Graduate" : "Undergraduate";
  const days = [...new Set(out.map(e => e.date))];
  const fmtShort = iso => fmtDate(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  const clashes = out.filter(e => e.clash).length;
  let html = `<div class="card-head"><img class="crest" src="${CREST}" alt="">
      <div><div class="kicker">AURAK · Student Government Association</div>
      <h2>Final Exam Schedule</h2><div class="term">${esc(termName)} · ${level}</div></div></div>`;
  if (out.length) html += `<div class="stats">
      <div><b>${out.length}</b><span>Exam${out.length === 1 ? "" : "s"}</span></div>
      <div><b>${days.length}</b><span>Day${days.length === 1 ? "" : "s"}</span></div>
      <div><b>${fmtShort(days[0])}</b><span>First exam</span></div>
      ${clashes ? `<div class="bad"><b>${clashes}</b><span>Clashing</span></div>` : `<div><b>${fmtShort(days[days.length - 1])}</b><span>Last exam</span></div>`}</div>`;
  if (!out.length) html += `<div class="empty"><span class="script">Your finals, sorted.</span>${picks.length ? "Choose your sections above to see your exams." : "Search for a course above to start building your schedule."}</div>`;
  for (const d of days) {
    const dt = fmtDate(d);
    html += `<div class="day"><div class="date"><div class="dow">${dt.toLocaleDateString("en-GB", { weekday: "short" })}</div>
      <div class="num">${dt.getDate()}</div><div class="mon">${dt.toLocaleDateString("en-GB", { month: "short" })} ${dt.getFullYear()}</div></div><div class="exams">`;
    for (const e of out.filter(x => x.date === d)) {
      const dur = (toMin(e.end) - toMin(e.start)) / 60;
      html += `<div class="exam${e.clash ? " clash" : ""}"><div class="time">${e.start} – ${e.end}<small>${dur} hours</small></div>
        <div class="course">${esc(e.course)}${e.section ? `<small>Section ${esc(e.section)}</small>` : ""}${titleOf(e.course) ? `<span class="ttl">${esc(titleOf(e.course))}</span>` : ""}</div>
        <div class="room${e.room === "Room depends on section" ? " soft" : ""}">${esc(e.room || "TBA")}</div>${e.clash ? `<div class="clashnote">⚠ Overlaps with another exam</div>` : ""}</div>`;
    }
    html += `</div></div>`;
  }
  if (pending.length && out.length) html += `<p class="pending">Pick a section for: ${pending.map(esc).join(", ")}</p>`;
  html += `<div class="foot"><span class="script">From the People, For the People, By the People</span><small>Verify with the registrar · Not found? Ask your instructor</small></div>`;
  $("sheet").innerHTML = html;
  const has = out.length > 0;
  $("png").disabled = $("ics").disabled = !has; $("clear").disabled = !picks.length;
}
$("chips").addEventListener("change", e => { if (e.target.matches("select")) { picks[+e.target.dataset.i].section = e.target.value; save(); render(); } });
$("chips").addEventListener("click", e => { const b = e.target.closest(".x"); if (b) { picks.splice(+b.dataset.i, 1); save(); render(); } });
$("clear").onclick = () => { picks = []; save(); render(); };

/* ---------- export ---------- */
function download(name, url) { const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
$("png").onclick = async () => {
  if (!window.html2canvas) { alert("Image export library failed to load. Take a screenshot of the schedule instead."); return; }
  try { await document.fonts.ready; } catch (e) {}
  const canvas = await html2canvas($("sheet"), { scale: 2, backgroundColor: null,
    onclone: d => { const el = d.getElementById("sheet"); el.style.width = "780px"; el.style.boxShadow = "none"; } });
  download("final-schedule.png", canvas.toDataURL("image/png"));
};
$("ics").onclick = () => {
  const { out } = resolved();
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const dt = (d, t) => d.replace(/-/g, "") + "T" + t.replace(":", "") + "00";
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Final Schedule Maker//EN"];
  out.forEach((e, i) => lines.push("BEGIN:VEVENT", `UID:${i}-${e.course.replace(/\W/g, "")}-${e.date}@final-schedule`, `DTSTAMP:${stamp}`,
    `DTSTART:${dt(e.date, e.start)}`, `DTEND:${dt(e.date, e.end)}`, `SUMMARY:${e.course}${titleOf(e.course) ? " " + titleOf(e.course) : ""} Final Exam`, `LOCATION:${e.room}`, "END:VEVENT"));
  lines.push("END:VCALENDAR");
  const url = URL.createObjectURL(new Blob([lines.join("\r\n")], { type: "text/calendar" }));
  download("final-schedule.ics", url); setTimeout(() => URL.revokeObjectURL(url), 1000);
};

/* ---------- init ---------- */
$("crestTop").src = CREST;
$("term").innerHTML = SHEETS.map(([n], i) => `<option value="${i}">${n}</option>`).join("");
$("term").onchange = () => { termIdx = +$("term").value; picks = []; save(); render(); loadTerm(termIdx); };
try {
  const s = JSON.parse(localStorage.getItem("fsm-state") || "null");
  if (s) { const i = SHEETS.findIndex(x => x[1] === s.term); if (i >= 0) { termIdx = i; picks = s.picks || []; } }
} catch (e) {}
$("term").value = termIdx;
render();
loadTerm(termIdx);
</script>
</body>
</html>
